packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  core-js-pure: false
  esbuild: false
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@types/node@26.1.0'
  - '@storybook/addon-themes@10.6.9'
  - '@storybook/builder-vite@10.6.9'
  - '@storybook/nextjs-vite@10.6.9'
  - '@storybook/react-dom-shim@10.6.9'
  - '@storybook/react-vite@10.6.9'
  - '@storybook/react@10.6.9'
  - storybook@10.6.9
  - vite-plugin-storybook-nextjs@10.6.9
