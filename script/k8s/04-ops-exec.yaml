# 运维终端：容器 exec（pods/exec: create）
#
# ⚠️ 高风险：等价于「在 Pod 内执行任意命令」，**默认不要 apply**。
# 仅授权运维管理员，并与以下三重开关叠加生效：
#   1. 环境开关 OPS_CONTAINER_EXEC_ENABLED=true
#   2. 连接开关 ops_connection.exec_enabled=1
#   3. 权限点 ops:terminal:exec
#
# 最低 K8s 版本：1.24
# 自检：
#   kubectl auth can-i create pods/exec -n prod --as=system:serviceaccount:ops-platform:ops-exec
# 禁止使用 cluster-admin 通吃；禁止提供 nodes/proxy（kubelet Summary 备路径）。
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-exec
  namespace: ops-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-exec
  namespace: prod
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-exec
  namespace: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-exec
subjects:
  - kind: ServiceAccount
    name: ops-exec
    namespace: ops-platform
