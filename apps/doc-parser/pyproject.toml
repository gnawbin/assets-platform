[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=68.0"]

[project]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pdfplumber>=0.11.0", # PDF 解析
  "pytesseract>=0.3.13", # OCR（扫描件 PDF 需要）
  "pdf2image>=1.17.0",
  "Pillow>=11.0.0", # 图片处理
  "python-docx>=1.1.0", # Word 解析（docx）
  "openpyxl>=3.1.0", # Excel 解析（xlsx）
  "openai-whisper>=20250625", # 语音转写
  "ffmpeg-python>=0.2.0", # 视频处理
  "python-dotenv>=1.0.0", # 配置
  "pydantic>=2.9.0",
  "sqlalchemy[asyncio]>=2.0.0", # SQLAlchemy ORM（PostgreSQL 持久化）
  "asyncpg>=0.30.0", # asyncpg 驱动（SQLAlchemy async 执行引擎）
  "surrealdb>=2.0.0", # SurrealDB Python SDK（向量检索）
  "sentence-transformers>=5.6.1",
  "imageio_ffmpeg>=0.6.0",
  "httpx>=0.27.0", # RAG /ask（Ollama OpenAI 兼容接口）
]
description = "多模态文档解析服务：PDF/Word/Excel/图片/音频/视频 → 纯文本"
name = "doc-parser"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[tool.setuptools]
packages = ["models", "parsers", "utils", "controllers", "services"]
