[package]
edition = "2024"
name = "workflow"
version = "0.1.0"

# 所有依赖版本均在根 Cargo.toml 的 [workspace.dependencies] 中定义
[dependencies]
adk-graph.workspace = true
async-trait.workspace = true
bpmn-parser.workspace = true
chrono.workspace = true
database.workspace = true
engine-core.workspace = true
# 沙箱执行节点：只依赖契约，由调用方注入 Arc<dyn SandboxRuntime>
sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
service.workspace = true
sqlx = { workspace = true, features = ["uuid", "json"] }
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }
