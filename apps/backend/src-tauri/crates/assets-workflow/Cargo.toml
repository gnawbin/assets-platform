[package]
name = "assets-workflow"
version = "0.1.0"
edition = "2021"

[dependencies]
assets-database = { path = "../assets-database" }
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "macros",
  "chrono",
  "rust_decimal",
] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
tracing = "0.1.44"
tokio = { version = "1.53.1", default-features = false, features = [
  "rt-multi-thread",
  "rt",
  "macros",
  "time",
  "fs",
  "net",
  "signal",
  "sync",
] }
async-trait = "0.1.91"
wfe-core = { version = "1.10.0", features = ["test-support"] }
wfe-yaml = "1.10.0"
