[package]
edition = "2024"
name = "server"
version = "0.1.0"

# 无头 HTTP 服务入口（Web 部署形态）
#
# 与桌面入口 `apps/backend/src-tauri/src/main.rs` 并列：
# - 桌面：tauri::Builder + invoke_handler（123 个 IPC 命令）+ 内嵌 HTTP 服务
# - 服务端：仅 axum HTTP API（crates/api），无 WebView / 无图形环境依赖
#
# 两个入口共用 crates/bootstrap 的初始化逻辑与 crates/* 的业务实现，
# 因此不存在「两套代码各改一遍」的问题。
#
# 构建：cargo build -p server --release
# 产物：target/release/assets-server(.exe)

[[bin]]
name = "assets-server"
path = "src/main.rs"

# 所有依赖版本均在根 Cargo.toml 的 [workspace.dependencies] 中定义
[dependencies]
anyhow.workspace = true
bootstrap.workspace = true
database.workspace = true
service.workspace = true
tokio.workspace = true
tracing.workspace = true
utils.workspace = true
