[package]
edition = "2024"
name = "bootstrap"
version = "0.1.0"

# 所有依赖版本均在根 Cargo.toml 的 [workspace.dependencies] 中定义
#
# 职责：桌面（Tauri）与无头 HTTP 服务（crates/server）共用的启动初始化逻辑。
# 本 crate 不依赖 tauri，因此可被无 GUI 环境单独编译。
[dependencies]
anyhow.workspace = true
api.workspace = true
apidoc.workspace = true
database.workspace = true
service.workspace = true
sqlx.workspace = true
toml.workspace = true
tracing.workspace = true
workflow.workspace = true
