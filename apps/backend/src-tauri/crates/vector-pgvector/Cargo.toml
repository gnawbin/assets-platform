[package]
edition = "2024"
name = "vector-pgvector"
version = "0.1.0"

[lints]
workspace = true

# PostgreSQL + pgvector 实现。
# 驱动（sqlx）只属于本 crate：crates/vector 与 crates/ops 都不感知它，
# 也不会把 sqlx 的编译代价带进 Tauri 主构建。
# 所有依赖版本均在根 Cargo.toml 的 [workspace.dependencies] 中定义
[dependencies]
vector.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
