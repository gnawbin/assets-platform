[package]
edition = "2024"
name = "service"
version = "0.1.0"

# 所有依赖版本均在根 Cargo.toml 的 [workspace.dependencies] 中定义
# 注：密码哈希统一走 utils::password_secret，本 crate 不再直接依赖 argon2
[dependencies]
database.workspace = true
storage.workspace = true
utils.workspace = true
# LLM 协议适配：契约 + 两套协议实现（OpenAI Chat Completions / Anthropic Messages）
llm.workspace = true
llm-anthropic.workspace = true
llm-openai.workspace = true
# 本地解析后端（DOC_PARSER_BACKEND=local），设计文档：docs/Rust原生多模态解析后端设计方案.md
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
# API Key 校验结果 / last_used_at 节流的进程内缓存（设计文档 §6.8）
dashmap.workspace = true
# 流式事件消费（LLMRouter::chat_stream 返回 ChatStream）
futures.workspace = true
jsonwebtoken.workspace = true
parser.workspace = true
# 运维采集（Docker / Swarm / K8s 只读连接器）；feature 在这里一次打开，api 与 tauri 层共用
ops = {workspace = true, features = ["docker", "k8s"]}
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
# HTTP 文档的 DTO schema（#[derive(ToSchema)]），由 crates/apidoc 汇总
utoipa.workspace = true
uuid.workspace = true
