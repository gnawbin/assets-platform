[package]
edition = "2024"
name = "vector"
version = "0.1.0"

[lints]
workspace = true

# 本 crate 刻意「零驱动依赖」：只有 trait 与数据类型。
# Redis / pgvector / LanceDB 的具体实现分别在 crates/vector-redis、vector-pgvector、vector-lance。
# 所有依赖版本均在根 Cargo.toml 的 [workspace.dependencies] 中定义
[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
