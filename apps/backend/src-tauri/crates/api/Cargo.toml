[package]
edition = "2024"
name = "api"
version = "0.1.0"

# 所有依赖版本均在根 Cargo.toml 的 [workspace.dependencies] 中定义
[dependencies]
anyhow.workspace = true
axum.workspace = true
# `client_secret_basic` 解析（RFC 6749 §2.3.1）
base64.workspace = true
# 鉴权缓存（路由→权限点 / 用户授权快照，设计文档 §6.8）
dashmap.workspace = true
database.workspace = true
engine.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
service.workspace = true
# 沙箱路由的响应类型（SandboxHandle / ExecResult / FileEntry / HealthInfo）
sandbox.workspace = true
sqlx.workspace = true
storage.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
# 凭证前缀分流（utils::api_key::is_api_key_token / parse_api_key_prefix）
utils.workspace = true
# OpenAPI 标注（#[utoipa::path] / ToSchema）：规范由 crates/apidoc 汇总并对外提供
utoipa.workspace = true
