[package]
name = "assets-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
assets-database = { path = "../assets-database" }
assets-utils = { path = "../assets-utils" }
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "macros",
  "chrono",
  "rust_decimal",
] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4"] }
thiserror = "2.0.19"
anyhow = "1.0.104"
tokio = { version = "1.53.1", default-features = false, features = [
  "rt-multi-thread",
  "rt",
  "macros",
  "time",
  "fs",
  "net",
  "signal",
  "sync",
] }
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = ["rustls"] }
aws-smithy-async = { version = "1.3.0", features = ["rt-tokio"] }

[dev-dependencies]
# 仅用于 examples/ 探测工具（s3_probe）打印 SDK 请求日志
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
