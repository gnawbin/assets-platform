[workspace]
members = ["crates/*"]
resolver = "2"

[package]
authors = ["gengyuwangbin"]
description = "资产平台APP"
edition = "2021"
name = "assets-platform"
version = "0.0.9"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "assetsplatform_lib"

[[bin]]
name = "assets-platform"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", default-features = false, features = [] } # 关闭默认特性

[dependencies]
tracing = "0.1.44"

# 加这一行（surrealdb / rand 兼容）
getrandom = { version = "0.4.3", features = ["std"] }

# Tauri 核心（最小特性集）
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = { version = "2.5.4", default-features = false }
tauri-plugin-process = "2.3.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"

# 内部业务 crate（crates/*）
assets-api = { path = "crates/assets-api" }
assets-database = { path = "crates/assets-database" }
assets-engine = { path = "crates/assets-engine" }
assets-service = { path = "crates/assets-service" }
assets-storage = { path = "crates/assets-storage" }
assets-utils = { path = "crates/assets-utils" }

# 序列化
serde = { version = "1.0.229", default-features = false, features = [
  "derive",
  "alloc",
] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }

# JWT（命令层）
jsonwebtoken = { version = "11.0.0", default-features = false, features = [
  "aws_lc_rs",
] }

# 数据库（命令层 / 工作流）
sqlx = { version = "0.9.0", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "macros",
  "chrono",
  "rust_decimal",
] }

# 异步运行时（只开必须的特性，不要 full）
tokio = { version = "1.53.1", default-features = false, features = [
  "rt-multi-thread",
  "rt",
  "macros",
  "time",
  "fs",
  "net",
  "signal",
  "sync",
] }
async-trait = "0.1.91"

# 工作流引擎
wfe-core = { version = "1.10.0", features = ["test-support"] }
wfe-yaml = "1.10.0"

# 配置（lib.rs 加载 .env.toml）
toml = "1.1.3+spec-1.1.0"

# Windows 平台兼容
winapi = { version = "0.3", features = [
  "memoryapi",
  "debugapi",
  "sysinfoapi",
  "processthreadsapi",
  "errhandlingapi",
] }

[dev-dependencies]
# 集成测试专用（tests/ 目录）
surrealdb = "3.2.3"
image = "0.25"
pdf_oxide = "0.3.76"

# Release模式优化配置
[profile.release]
codegen-units = 16
incremental = false
lto = false
opt-level = 2
panic = "abort"
strip = true

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

# 禁用增量编译，减少缓存
[profile.dev]
incremental = true
# 优化级别为0以加快编译速度
opt-level = 0
# 禁用调试信息以加速编译
debug = false

# 为特定依赖项设置优化级别（加快第三方库编译）
[profile.dev.package."*"]
opt-level = 2

# 优化生产构建的依赖项
[profile.release.package."*"]
opt-level = 2
