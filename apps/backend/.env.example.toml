[postgres]
host = "localhost"
port = 5432
database = "ceshi2"
username = "postgres"
password = "123456"
# 连接池最大连接数
max_connections = 10
# 连接池最小连接数
min_connections = 2
# 连接超时时间（秒）
connect_timeout = 30
# 空闲连接超时时间（秒）
idle_timeout = 300

# 从库副本配置（读写分离）
# 如果不配置从库，读写均走主库
# read_replicas 是一个数组，每个元素是一个从库配置
# 支持配置多个从库，使用加权轮询负载均衡
# 权重（weight）值越大，分配的读请求越多
# read_replicas = [
#     { host = "192.168.1.101", port = 5432, weight = 3, max_connections = 10, min_connections = 1 },
#     { host = "192.168.1.102", port = 5432, weight = 2, max_connections = 10, min_connections = 1 },
# ]

[otel]
enabled = true
exporter_otlp_protocol = "grpc"
exporter_otlp_endpoint = "http://localhost:4317"
service_name = "assets-platform"

[otel_frontend]
enabled = true
exporter_otlp_endpoint = "http://localhost:4318"
service_name = "assets-platform"

[api]
# API 适配器类型：tauri（桌面版）或 http（Web 版）
adapter = "tauri"
# HTTP 适配器基础 URL（仅当 adapter = "http" 时生效）
base_url = "http://localhost:3001/api"
# HTTP API 服务端口
port = 3001
# HTTP API 监听地址（对应环境变量 API_BIND）
#   0.0.0.0   = 所有网卡（缺省值，桌面端访问 localhost 兼容性最好）
#   127.0.0.1 = 仅本机；无头服务端（crates/server）推荐此值，对外由 nginx 反代
# bind = "0.0.0.0"

[auth]
# JWT 签名密钥（生产环境请更换为强密钥）
jwt_secret = "assets-platform-default-secret-key"

[s3]
# S3 兼容对象存储配置（支持 AWS S3、MinIO、RustFS 等）
# 使用 127.0.0.1 而非 localhost，规避 localhost 仅解析 IPv6(::1) 的兼容问题
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key = "h2J9GmpJnvN62WoqpFbd"
secret_key = "gywb123?"
bucket = "assets"
# 文件访问公共 URL（用于生成下载链接）
public_url = "http://localhost:9000/assets"

[snowflake]
# Snowflake ID 生成器的工作节点 ID（不同实例需不同值）
worker_id = 1

[surrealdb]
# SurrealDB 向量数据库配置（用于知识库向量搜索）
host = "127.0.0.1"
port = 8000
username = "admin"
password = "Admin@123456"
# 默认命名空间和数据库
namespace = "test"
database = "test"
# 是否启用 TLS
tls = false

# ======================== doc-parser（多模态解析服务）========================
# 支持三种部署模式，token 语义不同：
#
#   A 内嵌自启动（默认）：后端启动时拉起 uvicorn，并生成随机 token 注入子进程。
#      只需 enabled = true 即可，无需配置 token。
#
#   B 同机独立进程（systemd）/ C 同机独立容器（Docker）：
#      由部署方承载 doc-parser 进程，后端仅作为客户端调用（推荐生产使用）。
#      配置参考：
#          autostart = false
#          url  = "http://127.0.0.1:8321"
#          token = "<与 doc-parser 的 DOC_PARSER_TOKEN 完全一致>"
#      容器形态务必只用 -p 127.0.0.1:8321:8321 发布端口。
#      部署步骤见 docs/doc-parser 独立部署指南.md
#
# ⚠️ 生效状态说明（v1.2 实测更正）：
#   enabled / python / host / port        → ✅ 当前已生效（仅模式 A 拉起时使用）
#   backend                               → ✅ 当前已生效（local / remote 单开关；仅 remote 才拉起 Python）
#   token / url                           → ✅ 当前已生效（load_env 映射为 DOC_PARSER_TOKEN / DOC_PARSER_URL）
#                                            ⚠️ 但模式 A（enabled=true 且端口空闲）会用随机 UUID 覆盖 token
#   autostart / timeout_secs / health_path → ❌ 当前不生效（全仓无读取处），由 B0-4a 实现
[doc_parser]
# 解析后端：local = 进程内 Rust（crates/parser）；remote = Python 侧车（apps/doc-parser）
#   ⚠️ 代码缺省为 remote（与改造前行为完全一致）；桌面安装器会显式写 local
#   ⚠️ local 当前覆盖 pdf / doc / docx / xls / xlsx；图片 / 音频 / 视频待 Phase 3~5，仍请用 remote
#   设计文档：docs/Rust原生多模态解析后端设计方案.md
backend = "remote"
# 是否由后端起进程：模式 A = true；独立部署（systemd / Docker，后端只做客户端）= false
# ⚠️ 使用模式 A 请改回 true 并删除下面的 url/token（token 由后端生成并注入子进程）
enabled = false
# 客户端基址（独立部署）
url = "http://127.0.0.1:8321"
# 静态共享密钥（独立部署必填，需与 doc-parser 的 DOC_PARSER_TOKEN 完全一致）
#   ⚠️ 留空会导致 /chat 附件解析 401；若对端也未配 token 则为无鉴权直通（安全隐患）
#   生成：python -c "import uuid; print(uuid.uuid4())"
token = ""
# 以下为 B0-4a 后的推荐项，当前不生效：
# autostart = false
# timeout_secs = 600
# health_path = "/health"
# 仅模式 A（enabled = true）使用
python = "/home/ubuntu/conda/envs/aiagent/bin/python"
host = "127.0.0.1"
port = 8321

[llm]
# 凭证加密密钥（LLM API Key 与运维采集连接凭证共用），至少 32 字节；生产环境务必替换
key_encrypt_key = "please-change-me-to-a-32-byte-random-string"

# ======================== 沙箱（CubeSandbox）========================
# CubeSandbox 是独立部署的服务（控制面 CubeAPI + 数据面 CubeProxy），需要 Linux + KVM；
# 桌面端（Windows / macOS）无法本地运行，只能连远端。
#   enabled = false（缺省）→ 所有代码执行能力返回「沙箱未启用」，其余功能完全不受影响
#   本地 / 迁移环境没有沙箱时保持 false 即可，无需注释掉 url / template_id
# 设计文档：docs/知识库模块/CubeSandbox沙箱crate整合设计方案.md
[sandbox]
# 运行模式：in_process（默认，同进程、不启用沙盒）| cube | openshell
# - in_process：不连接任何沙箱服务，Agent / RAG / LLM 全部在平台进程内
# - cube：CubeSandbox（需要下方 base_url）
# - openshell：OpenShell gateway（后端实现中，当前会降级为 Disabled）
mode = "in_process"
# 兼容旧键（deprecated，仅在未设置 mode 时生效）
# enabled = false
# backend = "cube"
# CubeAPI 根地址（不含 /cubeapi/v1，程序会自动拼接；误拼后缀也会被容错去掉）
base_url = "http://127.0.0.1:3000"
# CubeAPI 鉴权：对应请求头 X-API-Key；留空则无鉴权访问（仅建议本地调试）
api_key = ""
# 默认模板（ID 或别名）；创建会话时使用
template_id = ""
# 数据面虚拟主机后缀：{端口}-{沙箱ID}.{后缀}
data_host_suffix = "cube.app"
# 数据面 envd 端口（执行命令 / 读写文件走这里）
envd_port = 49983
# 无 DNS 环境：直连该 IP 并保留虚拟 Host 头（对应官方 CUBE_PROXY_NODE_IP）；留空走 DNS
proxy_node_ip = ""
# ---- OpenShell（mode = "openshell" 时需要；gateway 独立部署）----
# gRPC 地址；TLS 用 https://
# - Docker Compose（仅开发）：http://openshell-gateway:8080（同一 compose 网络内的服务名）
# - K8s（生产）：https://openshell.<ns>.svc.cluster.local:9443，并配置下面的私有 CA
openshell_gateway_url = "http://127.0.0.1:8080"
# Bearer token（留空 = 无鉴权，仅限内网 / 本地调试；生产用 K8s Secret 注入）
openshell_token = ""
# 私有 CA 的 PEM 路径（https 时使用）
# - Docker Compose（仅开发）：通常留空（自签证书请挂载后指向容器内路径）
# - K8s（生产）：/etc/openshell/ca/ca.crt（由 Secret 挂载到 Pod）
openshell_ca_cert = ""
# 目标 workspace（多租户隔离边界）
openshell_workspace = "default"
# 默认镜像与主进程命令（命令是逗号串；serve 未实现 → 用 sleep,infinity 常驻，step 由平台 exec 调起）
openshell_image = ""
openshell_command = ""
# 建箱后等待 Ready 的超时（秒）
openshell_ready_timeout_secs = 120
# 代码解释器（缺省 python3；模板内为其它路径时调整）
python = "python3"
# 单次执行 / 沙箱存活超时（秒）
timeout_secs = 60
# 会话空闲多久后自动 pause（秒）；保留现场，下次使用 resume
session_ttl_secs = 900
# pause 之后再过多久直接 kill（秒）
kill_after_secs = 3600
# 空闲回收任务扫描间隔（秒，最小 30）
reaper_interval_secs = 60
# ---- M1b：Agent 循环搬进沙箱（需 mode = "openshell"）----
# 是否把 Agent（LLM + 工具循环）放进沙箱；false = 平台进程内（M1a）
agent_in_sandbox = false
# 沙箱内 runner 调用的平台内部 LLM 端点（OpenAI 兼容、非流式）
# 注意：必须写「沙箱内可访问」的地址（容器网络里的服务名），不是宿主 127.0.0.1
agent_llm_base_url = "http://assets-server:3001/internal/llm/v1"
# 沙箱内从该环境变量读取 Bearer token（平台建箱时注入）
agent_token_env = "AGENT_TOKEN"
# 注入沙箱的 token 本体（租户级 API Key，scope 必须含 sandbox:llm）
# 映射为 SANDBOX_AGENT_TOKEN；留空 → 沙箱内 LLM 调用 401，且平台只 WARN 一次
agent_token = ""
# 缺省模型（节点未配置 model 时使用；留空则由 LLM 网关决定）
agent_model = ""
# 单步超时（秒；实际 exec 超时 = 该值 + 10）
agent_step_timeout_secs = 120
# 步数上限：与节点 config.max_iterations 取小（min），达到后**优雅结束**（Completed，不触发重试）
agent_max_steps = 6
# 沙箱内单次工具命令超时（秒，写入 step.json 的 limits）
agent_exec_timeout_secs = 60
# 逐步写 `agent_step` 审计（sys_oper_log）；审批申请 / 结论不受该开关影响
# false = 只记审批事件，降低审计写入量
agent_audit_steps = true

