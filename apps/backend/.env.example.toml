[postgres]
host = "localhost"
port = 5432
database = "assets_plateform"
username = "postgres"
password = "123456"
# 连接池最大连接数
max_connections = 10
# 连接池最小连接数
min_connections = 2
# 连接超时时间（秒）
connect_timeout = 30
# 空闲连接超时时间（秒）
idle_timeout = 300

# 从库副本配置（读写分离）
# 如果不配置从库，读写均走主库
# read_replicas 是一个数组，每个元素是一个从库配置
# 支持配置多个从库，使用加权轮询负载均衡
# 权重（weight）值越大，分配的读请求越多
# read_replicas = [
#     { host = "192.168.1.101", port = 5432, weight = 3, max_connections = 10, min_connections = 1 },
#     { host = "192.168.1.102", port = 5432, weight = 2, max_connections = 10, min_connections = 1 },
# ]

[otel]
enabled = true
exporter_otlp_protocol = "grpc"
exporter_otlp_endpoint = "http://localhost:4317"
service_name = "assets-platform"

[otel_frontend]
enabled = true
exporter_otlp_endpoint = "http://localhost:4318"
service_name = "assets-platform"

[api]
# API 适配器类型：tauri（桌面版）或 http（Web 版）
adapter = "tauri"
# HTTP 适配器基础 URL（仅当 adapter = "http" 时生效）
base_url = "http://localhost:3001/api"
# HTTP API 服务端口
port = 3001

[auth]
# JWT 签名密钥（生产环境请更换为强密钥）
jwt_secret = "assets-platform-default-secret-key"

[s3]
# S3 兼容对象存储配置（支持 AWS S3、MinIO、RustFS 等）
# 使用 127.0.0.1 而非 localhost，规避 localhost 仅解析 IPv6(::1) 的兼容问题
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key = "minioadmin"
secret_key = "minioadmin"
bucket = "assets-platform"
# 文件访问公共 URL（用于生成下载链接）
public_url = "http://localhost:9000/assets-platform"

[snowflake]
# Snowflake ID 生成器的工作节点 ID（不同实例需不同值）
worker_id = 1

[surrealdb]
# SurrealDB 向量数据库配置（用于知识库向量搜索）
host = "127.0.0.1"
port = 8000
username = "admin"
password = "Admin@123456"
# 默认命名空间和数据库
namespace = "test"
database = "test"
# 是否启用 TLS
tls = false

# ======================== doc-parser（多模态解析服务）========================
# 支持三种部署模式，token 语义不同：
#
#   A 内嵌自启动（默认）：后端启动时拉起 uvicorn，并生成随机 token 注入子进程。
#      只需 enabled = true 即可，无需配置 token。
#
#   B 同机独立进程（systemd）/ C 同机独立容器（Docker）：
#      由部署方承载 doc-parser 进程，后端仅作为客户端调用（推荐生产使用）。
#      配置参考：
#          autostart = false
#          url  = "http://127.0.0.1:8321"
#          token = "<与 doc-parser 的 DOC_PARSER_TOKEN 完全一致>"
#      容器形态务必只用 -p 127.0.0.1:8321:8321 发布端口。
#      部署步骤见 docs/doc-parser 独立部署指南.md
#
# ⚠️ 生效状态说明（v1.2 实测更正）：
#   enabled / python / host / port        → ✅ 当前已生效（仅模式 A 拉起时使用）
#   token / url                           → ✅ 当前已生效（load_env 映射为 DOC_PARSER_TOKEN / DOC_PARSER_URL）
#                                            ⚠️ 但模式 A（enabled=true 且端口空闲）会用随机 UUID 覆盖 token
#   autostart / timeout_secs / health_path → ❌ 当前不生效（全仓无读取处），由 B0-4a 实现
[doc_parser]
# 是否由后端起进程：模式 A = true；独立部署（systemd / Docker，后端只做客户端）= false
# ⚠️ 使用模式 A 请改回 true 并删除下面的 url/token（token 由后端生成并注入子进程）
enabled = false
# 客户端基址（独立部署）
url = "http://127.0.0.1:8321"
# 静态共享密钥（独立部署必填，需与 doc-parser 的 DOC_PARSER_TOKEN 完全一致）
#   ⚠️ 留空会导致 /chat 附件解析 401；若对端也未配 token 则为无鉴权直通（安全隐患）
#   生成：python -c "import uuid; print(uuid.uuid4())"
token = ""
# 以下为 B0-4a 后的推荐项，当前不生效：
# autostart = false
# timeout_secs = 600
# health_path = "/health"
# 仅模式 A（enabled = true）使用
python = "/home/ubuntu/conda/envs/aiagent/bin/python"
host = "127.0.0.1"
port = 8321
