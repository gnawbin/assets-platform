[postgres]
host = "localhost"
port = 5432
database = "ceshi2"
username = "postgres"
password = "123456"

[otel]
enabled = false 
exporter_otlp_protocol = "grpc"
exporter_otlp_endpoint = "http://localhost:4317"
service_name = "assets-platform"

[otel_frontend]
enabled = false
exporter_otlp_endpoint = "http://localhost:4318"
service_name = "assets-platform"

[api]
# API 适配器类型：tauri（桌面版）或 http（Web 版）
adapter = "tauri"
# HTTP 适配器基础 URL（仅当 adapter = "http" 时生效）
base_url = "http://localhost:3001/api"
# HTTP API 服务端口
port = 3001

[auth]
# JWT 签名密钥（生产环境请更换为强密钥）
jwt_secret = "assets-platform-default-secret-key"

[snowflake]
# Snowflake ID 生成器的工作节点 ID（不同实例需不同值）
worker_id = 1

[s3]
# RustFS S3 兼容存储配置
endpoint = "http://localhost:9000"
region = "us-east-1"
access_key = "TjsRayv4ljtgnJPUdtlJ"
secret_key = "kHRwTD5zJ2vROxaQH139qoLdEZXBY5jDpH1DyrjJ"
bucket = "assets"
# 文件访问公共 URL（用于生成下载链接）
public_url = "http://localhost:9000/assets"

[doc_parser]
# doc-parser 侧车服务（多模态解析：PDF/图片/音频/视频 → 文本）
# enabled = true 时，后端启动会自动拉起 doc-parser（aiagent conda 环境）
enabled = true
python = "/home/ubuntu/conda/envs/aiagent/bin/python"
host = "127.0.0.1"
port = 8321

