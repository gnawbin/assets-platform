[postgres]
host = "localhost"
port = 5432
database = "asset-plateform"
username = "postgres"
password = "123456"

[otel]
enabled = false 
exporter_otlp_protocol = "grpc"
exporter_otlp_endpoint = "http://localhost:4317"
service_name = "assets-platform"

[otel_frontend]
enabled = false
exporter_otlp_endpoint = "http://localhost:4318"
service_name = "assets-platform"

[api]
# API 适配器类型：tauri（桌面版）或 http（Web 版）
adapter = "tauri"
# HTTP 适配器基础 URL（仅当 adapter = "http" 时生效）
base_url = "http://localhost:3001/api"
# HTTP API 服务端口
port = 3001

[auth]
# JWT 签名密钥（生产环境请更换为强密钥）
jwt_secret = "assets-platform-default-secret-key"

[snowflake]
# Snowflake ID 生成器的工作节点 ID（不同实例需不同值）
worker_id = 1

[s3]
# RustFS S3 兼容存储配置
endpoint = "http://127.0.0.1:9000"
region = "us-east-1"
access_key = "7MH1DCmtViMEozLyfz0X"
secret_key = "bzGkNwG1A4SAc2XnnSfXf1eCP2tBXBxdCFnoNpMX"
bucket = "assets"
# 文件访问公共 URL（用于生成下载链接）
public_url = "http://127.0.0.1:9000/assets"

