[package]
name = "assets-platform"
version = "0.0.2"
description = "资产平台APP"
authors = ["gengyuwangbin"]
edition = "2021"
rust-version = "1.75"  # 固定版本，避免重复编译

[lib]
name = "assetsplatform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", default-features = false , features = [] }  # 关闭默认特性

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# OTel 核心
opentelemetry = { version = "0.32.0", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32.1", features = [
  "rt-tokio", "trace", "metrics", "logs"
] }
opentelemetry-otlp = { version ="0.32.0", features = [
  "grpc-tonic", "http-proto", "trace", "logs", "metrics"
] }
tracing-opentelemetry = "0.33.0"   # tracing ↔ OTel 桥接
opentelemetry-appender-tracing = "0.32.0"  # 日志桥接

argon2 = "0.5.3"          # 最强密码哈希
password-hash = "0.6.1"   # 哈希工具
rand = "0.10.1"    
# Tauri 核心（最小特性集）
tauri = { version = "2.11.2", default-features = false, features = ["wry"] }
tauri-plugin-opener = { version = "2.5.4", default-features = false }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2.3.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-fs = "2.5.1"
# 序列化
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# JWT
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs"] }

# 数据库（仅 PostgreSQL）
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono"] }

# 异步运行时（只开必须的特性，不要 full）
tokio = { version = "1.52", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
    
    "fs",
    "net",
] }
uuid = { version = "1.23.1", features = ["v4"] }
# HTTP 客户端
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
# 异步流处理
futures = "0.3"



# URL 解析
url = "2.0"
# 目录路径
dirs = "6.0.0"
# 懒加载静态变量
lazy_static = "1.5.0"
# 明确指定兼容版本
base64 = "0.22.1"
# 正则表达式
regex = "1.10"
# Cron表达式解析
cron = "0.16.0"
# 加密相关
aes = "0.8.2"          # 降级稳定版
cbc = "0.1.2"          # 降级稳定版
zeroize = { version = "1.8.2", features = ["derive"] }
sha2 = "0.11.0"
block-padding = "0.3.0" # 配套版本
pbkdf2 = "0.13.0"
hmac = "0.13.0"


winapi = { version = "0.3", features = ["memoryapi", "debugapi", "sysinfoapi", "processthreadsapi", "errhandlingapi"] }



log = "0.4.30"
hex="0.4"

# 工具库
config = { version = "0.15", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
once_cell = "1.21.4"
thiserror = "2.0.18"
anyhow = "1.0.98"
dotenvy = "0.15"
twitter_snowflake = "1.0.2"
opa-wasm = "0.2.0"

# Release模式优化配置
[profile.release]
lto = false
codegen-units = 16
opt-level = 2
strip = true
panic = "abort"
incremental = false

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

# 禁用增量编译，减少缓存
[profile.dev]
incremental = true
# 优化级别为0以加快编译速度
opt-level = 0
# 禁用调试信息以加速编译
debug = false

# 为特定依赖项设置优化级别（加快第三方库编译）
[profile.dev.package."*"]
opt-level = 2

# 优化生产构建的依赖项
[profile.release.package."*"]
opt-level = 2

# Remove patch to use default version
[patch.crates-io]
