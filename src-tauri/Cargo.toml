[package]
name = "assets-platform"
version = "0.1.0"
description = "资产平台APP"
authors = ["gengyuwangbin"]
edition = "2021"
rust-version = "1.75"  # 固定版本，避免重复编译

[lib]
name = "assetsplatform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", default-features = false }  # 关闭默认特性

[dependencies]
# Tauri 核心（最小特性集）
tauri = { version = "2.10.3", default-features = false, features = ["wry"] }
tauri-plugin-opener = { version = "2.5.3", default-features = false }

# 序列化
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# JWT
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs"] }

# 权限

# 数据库（SQLx + SQLite 最小化）
sqlx = { version = "0.8.6", default-features = false, features = [
    "sqlite",
    "runtime-tokio-native-tls",
    "macros",
    "chrono",
] }
libsqlite3-sys = { version = "0.30.0", features = ["bundled-sqlcipher"] }

# 异步运行时（只开必须的特性，不要 full）
tokio = { version = "1.52", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
    
    "fs",
    "net",
] }

# 工具库
config = { version = "0.15", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
once_cell = "1.21.4"
thiserror = "2.0.18"
anyhow = "1.0.98"
# Release模式优化配置
[profile.release]
lto = false
codegen-units = 16
opt-level = 2
strip = true
panic = "abort"
incremental = false

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

# 禁用增量编译，减少缓存
[profile.dev]
incremental = true
# 优化级别为0以加快编译速度
opt-level = 0
# 禁用调试信息以加速编译
debug = false

# 为特定依赖项设置优化级别（加快第三方库编译）
[profile.dev.package."*"]
opt-level = 2

# 优化生产构建的依赖项
[profile.release.package."*"]
opt-level = 2

# Remove patch to use default version
[patch.crates-io]
